  useEffect(() => {

    }
  }, [name]);

  return <i data-lucide={name} className={`inline-block ${className}`} style={{ width: size, height: size, color: color || 'currentColor' }}></i>;
};

// -------------------------------------------------------------
// MAIN APP COMPONENT
// -------------------------------------------------------------
function App() {
  const [role, setRole] = useState('citizen'); // 'citizen' | 'counselor' | 'governance'
  const [citizenTab, setCitizenTab] = useState('preview'); // 'home' | 'preview' | 'appointments' | 'privacy'
  const [scenario, setScenario] = useState('concordant'); // 'concordant' | 'discordant' | 'clear'
  const [lang, setLang] = useState('en'); // 'en' | 'ar'
  
  // Modals & Interactivity
  const [showPsiModal, setShowPsiModal] = useState(false);
  const [showReceiptModal, setShowReceiptModal] = useState(false);
  const [showValuesModal, setShowValuesModal] = useState(false);
  const [showTeachBackModal, setShowTeachBackModal] = useState(false);
  const [teachBackPassed, setTeachBackPassed] = useState(false);
  const [teachBackScore, setTeachBackScore] = useState(null);

  // Counselor Dashboard Interactive State
  const [chatMessages, setChatMessages] = useState([
    { id: 1, sender: 'counselor', text: 'Hey, Sarah! How can I help you today regarding your pre-marital genomic review?', time: '6:02 pm' },
    { id: 2, sender: 'patient', text: 'Hey Dr. Fatima! Saeed and I just finished the PSI match. Does being a carrier for Beta-Thalassemia mean I have the illness?', time: '6:06 pm' }
  ]);
  const [chatInput, setChatInput] = useState('');

  // Booking Interactive State
  const [meetingType, setMeetingType] = useState('video');
  const [selectedDay, setSelectedDay] = useState(24);
  const [selectedSlot, setSelectedSlot] = useState('10:00 AM');
  const [bookingConfirmed, setBookingConfirmed] = useState(false);

  // Audit Logs (Appends dynamically)
  const [auditLogs, setAuditLogs] = useState([
    { id: 1, time: '2026-02-04 14:32:15', user: 'Dr. Fatima Al-Hashimi', role: 'Doctor', action: 'UPDATE', module: 'Patient Records', details: 'Updated risk counseling notes for Couple #AE-9482 (Tier 3)', status: 'Success' },
    { id: 2, time: '2026-02-04 14:28:30', user: 'Malaffi Enclave', role: 'System', action: 'CREATE', module: 'Alerts', details: 'Automated Tier 3 hold triggered for concordant HBB variant', status: 'Success' },
    { id: 3, time: '2026-02-04 14:15:42', user: 'Saeed Al-Nuaimi', role: 'Citizen', action: 'ZKP_MATCH', module: 'PSI Protocol', details: 'Executed 2-party Private Set Intersection with Partner Fatima', status: 'Success' },
    { id: 4, time: '2026-02-04 14:10:18', user: 'Admin Al-Zaabi', role: 'Administrator', action: 'UPDATE', module: 'Roles & Permissions', details: 'Verified DoH genetic counselor accreditation license #GC-883', status: 'Success' },
    { id: 5, time: '2026-02-04 14:05:55', user: 'UAE Pass Gateway', role: 'Auth', action: 'CREATE', module: 'Consent Vault', details: 'Biometric authorization granted for Couple Cryptographic Session', status: 'Success' },
    { id: 6, time: '2026-02-04 13:58:22', user: 'External Lab Partner', role: 'Lab', action: 'READ', module: 'Patient Records', details: 'Attempted to query raw unencrypted VCF file without token', status: 'Failed' },
    { id: 7, time: '2026-02-04 13:45:10', user: 'Fatima Al-Zaabi', role: 'Citizen', action: 'UPDATE', module: 'Consent Vault', details: 'Revoked Tier 3 Extended Family Cascade Notification permission', status: 'Success' },
    { id: 8, time: '2026-02-04 13:30:45', user: 'Dr. Daniel Reynolds', role: 'Doctor', action: 'READ', module: 'Appointments', details: 'Opened pre-counseling values worksheet for session #APT-2026-09', status: 'Success' },
  ]);

  const t = i18n[lang];
  const isRTL = lang === 'ar';

  const handleSendMessage = (e) => {
    e.preventDefault();
    if (!chatInput.trim()) return;
    const newMsg = {
      id: Date.now(),
      sender: 'patient',
      text: chatInput,
      time: '6:08 pm'
    };
    setChatMessages(prev => [...prev, newMsg]);
    setChatInput('');

    // Counselor automated empathetic reply simulation
    setTimeout(() => {
      setChatMessages(prev => [...prev, {
        id: Date.now() + 1,
        sender: 'counselor',
        text: 'That is a completely normal question! Being a healthy carrier means you have normal health with zero symptoms. It only becomes significant for reproductive planning when both partners carry the same gene.',
        time: '6:09 pm'
      }]);
    }, 1200);
  };

  const addAuditLog = (action, module, details, status = 'Success') => {
    const newEntry = {
      id: Date.now(),
      time: new Date().toISOString().replace('T', ' ').substring(0, 19),
      user: role === 'citizen' ? 'Saeed (Citizen)' : 'Dr. Fatima (Counselor)',
      role: role === 'citizen' ? 'Citizen' : 'Doctor',
      action,
      module,
      details,
      status
    };
    setAuditLogs(prev => [newEntry, ...prev]);
  };

  return (
    <div className={`min-h-screen bg-[#F8FAFC] text-slate-800 ${isRTL ? 'rtl-direction font-arabic' : 'ltr-direction font-sans'}`}>
      
      {/* ========================================================= */}
      {/* TOP MASTER CONTROLLER BAR (Ecosystem switcher & Scenario) */}
      {/* ========================================================= */}
      <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 lg:px-8 py-2.5 flex flex-wrap items-center justify-between gap-3 shadow-xs">
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 via-teal-600 to-emerald-400 flex items-center justify-center text-white shadow-sm shadow-emerald-200">
            <span className="font-bold text-sm tracking-wider">AGY</span>
          </div>
          <div>
            <div className="flex items-center gap-2">
              <h1 className="font-bold text-slate-900 text-sm md:text-base leading-tight">{t.appTitle}</h1>
              <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                Abu Dhabi DoH & Malaffi HIE
              </span>
            </div>
            <p className="text-xs text-slate-500 hidden sm:block">{t.appSubtitle}</p>
          </div>
        </div>

        {/* Center Controls: Role Switcher */}
        <div className="flex items-center bg-slate-100 p-1 rounded-2xl border border-slate-200/80 text-xs font-semibold">
          <button
            onClick={() => { setRole('citizen'); addAuditLog('READ', 'Citizen Portal', 'Switched context to Citizen/Couple Portal'); }}
            className={`px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 ${role === 'citizen' ? 'bg-white text-slate-900 shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900'}`}
          >
            <span className="w-2 h-2 rounded-full bg-blue-500"></span>
            {t.roleCitizen}
          </button>
          <button
            onClick={() => { setRole('counselor'); addAuditLog('READ', 'Counselor Hub', 'Accessed Clinical Triage Workspace'); }}
            className={`px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 ${role === 'counselor' ? 'bg-[#74B47C] text-white shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900'}`}
          >
            <span className="w-2 h-2 rounded-full bg-emerald-200"></span>
            {t.roleCounselor}
          </button>
          <button
            onClick={() => { setRole('governance'); addAuditLog('READ', 'Audit Log', 'Accessed MedFlow Compliance Audit Ledger'); }}
            className={`px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 ${role === 'governance' ? 'bg-slate-900 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900'}`}
          >
            <span className="w-2 h-2 rounded-full bg-indigo-400"></span>
            {t.roleGovernance}
          </button>
        </div>

        {/* Right Tools: Clinical Scenario & PSI Modal & Language */}
        <div className="flex items-center gap-2">
          {/* Clinical Scenario Selector */}
          <div className="flex items-center gap-1.5 bg-amber-50/80 border border-amber-200 px-2 py-1 rounded-xl text-xs">
            <span className="text-amber-800 font-medium hidden md:inline">{t.scenario}</span>
            <select
              value={scenario}
              onChange={(e) => {
                setScenario(e.target.value);
                addAuditLog('UPDATE', 'Scenario Engine', `Switched clinical scenario to: ${e.target.value}`);
              }}
              className="bg-transparent text-amber-950 font-bold outline-hidden cursor-pointer"
            >
              <option value="concordant">🔴 Tier 3: Concordant (HBB)</option>
              <option value="discordant">🟡 Tier 2: Discordant (G6PD)</option>
              <option value="clear">🟢 Tier 1: Clear Screen</option>
            </select>
          </div>

          {/* Cryptographic Inspector Button */}
          <button
            onClick={() => setShowPsiModal(true)}
            className="flex items-center gap-1.5 bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 px-3 py-1.5 rounded-xl text-xs font-semibold transition"
          >
            <span className="relative flex h-2 w-2">
              <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
              <span className="relative inline-flex rounded-full h-2 w-2 bg-blue-600"></span>
            </span>
            {t.psiInspector}
          </button>

          {/* Language Toggle */}
          <button
            onClick={() => setLang(lang === 'en' ? 'ar' : 'en')}
            className="px-2.5 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-xs font-bold text-slate-700 transition"
          >
            {lang === 'en' ? '🇦🇪 العربية' : '🇺🇸 English'}
          </button>
        </div>
      </header>

      {/* ========================================================= */}
      {/* MAIN VIEWPORT SWITCHER ACCORDING TO USER ROLES & SAMPLES  */}
      {/* ========================================================= */}

      {/* ROLE 1: CITIZEN & COUPLE VIEW (Replicating Images 3, 4, 5, 2) */}
      {role === 'citizen' && (
        <CitizenPortalView
          citizenTab={citizenTab}
          setCitizenTab={setCitizenTab}
          scenario={scenario}
          t={t}
          isRTL={isRTL}
          setShowPsiModal={setShowPsiModal}
          setShowReceiptModal={setShowReceiptModal}
          setShowValuesModal={setShowValuesModal}
          setShowTeachBackModal={setShowTeachBackModal}
          teachBackPassed={teachBackPassed}
          selectedDay={selectedDay}
          setSelectedDay={setSelectedDay}
          selectedSlot={selectedSlot}
          setSelectedSlot={setSelectedSlot}
          meetingType={meetingType}
          setMeetingType={setMeetingType}
          bookingConfirmed={bookingConfirmed}
          setBookingConfirmed={setBookingConfirmed}
          addAuditLog={addAuditLog}
        />
      )}

      {/* ROLE 2: GENETIC COUNSELOR VIEW (Replicating Image 1: Green Medical Dashboard) */}
      {role === 'counselor' && (
        <CounselorDashboardView
          t={t}
          isRTL={isRTL}
          scenario={scenario}
          chatMessages={chatMessages}
          chatInput={chatInput}
          setChatInput={setChatInput}
          handleSendMessage={handleSendMessage}
          setShowValuesModal={setShowValuesModal}
        />
      )}

      {/* ROLE 3: MALAFFI & DOH GOVERNANCE (Replicating Image 6: MedFlow Audit Log) */}
      {role === 'governance' && (
        <MedFlowAuditView
          t={t}
          isRTL={isRTL}
          auditLogs={auditLogs}
        />
      )}

      {/* ========================================================= */}
      {/* MODALS: PSI Cryptographic Inspector, Receipts, Values     */}
      {/* ========================================================= */}
      {showPsiModal && (
        <CryptographicPsiModal
          scenario={scenario}
          onClose={() => setShowPsiModal(false)}
          isRTL={isRTL}
        />
      )}

      {showReceiptModal && (
        <ConsentReceiptModal
          onClose={() => setShowReceiptModal(false)}
          isRTL={isRTL}
        />
      )}

      {showValuesModal && (
        <ValuesClarificationModal
          onClose={() => setShowValuesModal(false)}
          isRTL={isRTL}
          onSave={() => {
            setShowValuesModal(false);
            addAuditLog('CREATE', 'Care Plans', 'Submitted private pre-counseling values clarification responses');
          }}
        />
      )}

      {showTeachBackModal && (
        <TeachBackModal
          onClose={() => setShowTeachBackModal(false)}
          onPass={(score) => {
            setTeachBackPassed(true);
            setTeachBackScore(score);
            setShowTeachBackModal(false);
            addAuditLog('UPDATE', 'Teach-Back Engine', `Citizen passed genetic comprehension check with score ${score}/3`);
          }}
          isRTL={isRTL}
        />
      )}
    </div>
  );
}

// =======================================================================
// COMPONENT 1: CITIZEN PORTAL (Incorporating Images 2, 3, 4, 5)
// =======================================================================
function CitizenPortalView({
  citizenTab,
  setCitizenTab,
  scenario,
  t,
  isRTL,
  setShowPsiModal,
  setShowReceiptModal,
  setShowValuesModal,
  setShowTeachBackModal,
  teachBackPassed,
  selectedDay,
  setSelectedDay,
  selectedSlot,
  setSelectedSlot,
  meetingType,

          <p className="text-xs text-slate-500 mt-1">
            {isRTL
              ? 'تأكيد بسيط للتأكد من وضوح الفرق بين كونك حاملاً لطفرة سليمة وبين الإصابة السريرية.'
              : 'A brief 3-question checkpoint ensuring clear distinction between healthy carrier status and clinical diagnosis.'}
          </p>
        </div>

        <div className="space-y-4 text-xs">
          {/* Question 1 */}
          <div className="space-y-2">
            <span className="font-bold text-slate-800 block">
              1. What does it mean if a screening report says you are a "carrier" for Beta-Thalassemia?
            </span>
            <div className="space-y-1">
              <label className="flex items-center gap-2 p-2 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
                <input type="radio" name="q1" value="a" onChange={() => setQ1('a')} />
                <span>I have an active illness and need immediate treatment.</span>
              </label>
              <label className="flex items-center gap-2 p-2 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
                <input type="radio" name="q1" value="b" onChange={() => setQ1('b')} />
                <span className="font-semibold text-slate-900">I am healthy with no symptoms, but carry one recessive gene copy.</span>
              </label>
            </div>
          </div>

          {/* Question 2 */}
          <div className="space-y-2">
            <span className="font-bold text-slate-800 block">
              2. If both partners carry the same recessive gene, what is the chance for each pregnancy to have the condition?
            </span>
            <div className="space-y-1">
              <label className="flex items-center gap-2 p-2 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
                <input type="radio" name="q2" value="a" onChange={() => setQ2('a')} />
                <span>100% chance</span>
              </label>
              <label className="flex items-center gap-2 p-2 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
                <input type="radio" name="q2" value="c" onChange={() => setQ2('c')} />
                <span className="font-semibold text-slate-900">25% (1 in 4) chance per pregnancy</span>
              </label>
            </div>
          </div>

          {/* Question 3 */}
          <div className="space-y-2">
            <span className="font-bold text-slate-800 block">
              3. Is carrying recessive genetic variants rare among humans?
            </span>
            <div className="space-y-1">
              <label className="flex items-center gap-2 p-2 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
                <input type="radio" name="q3" value="a" onChange={() => setQ3('a')} />
                <span className="font-semibold text-slate-900">No, every human naturally carries 3 to 5 recessive variants.</span>
              </label>
              <label className="flex items-center gap-2 p-2 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
                <input type="radio" name="q3" value="b" onChange={() => setQ3('b')} />
                <span>Yes, it only affects a very small fraction of people.</span>
              </label>
            </div>
          </div>
        </div>

        <div className="flex justify-end gap-3 pt-4 border-t border-slate-100">
          <button onClick={onClose} className="text-xs font-bold text-slate-500 hover:text-slate-800 px-4 py-2">
            Close
          </button>
          <button
            onClick={handleSubmit}
            className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-6 py-2.5 rounded-xl transition shadow-xs"
          >
            Submit & Verify
          </button>
        </div>
      </div>
    </div>
  );
}

// -------------------------------------------------------------
// MOUNT APPLICATION
// -------------------------------------------------------------
const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);

</script>
</body>
</html>
